<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10251d" />
    <meta name="description" content="頭のまわりを舞う蝶と、ひと休みするAR体験" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>蝶の森へ</title>
  </head>
  <body>
    <main id="app">
      <section id="welcome" class="panel panel--welcome">
        <p class="eyebrow">30秒の森時間</p>
        <h1>蝶の森へ</h1>
        <p class="lead">正面カメラに蝶を呼んで、週末の森の景色に思いを馳せよう。</p>
        <ul class="notes">
          <li>映像は端末内で処理され、送信されません</li>
          <li>明るい場所で、顔全体を画面に入れてください</li>
        </ul>
        <button id="start-button" class="primary-button" type="button">蝶を呼ぶ</button>
      </section>

      <section id="experience" class="experience" hidden aria-label="ARカメラ">
        <video id="camera" playsinline muted></video>
        <div class="forest-frame" aria-hidden="true">
          <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#08150f" />
                <stop offset="55%" stop-color="#10281c" stop-opacity="0.92" />
                <stop offset="100%" stop-color="#10281c" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="leftGrove" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#07140f" />
                <stop offset="58%" stop-color="#123224" stop-opacity="0.88" />
                <stop offset="100%" stop-color="#123224" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="rightGrove" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0%" stop-color="#07140f" />
                <stop offset="58%" stop-color="#123224" stop-opacity="0.88" />
                <stop offset="100%" stop-color="#123224" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect width="390" height="168" fill="url(#canopy)" />
            <rect width="92" height="844" fill="url(#leftGrove)" />
            <rect x="298" width="92" height="844" fill="url(#rightGrove)" />
            <g fill="#0a1c14">
              <path d="M0 0h390v42c-38 28-86 38-130 28-22-5-38 12-36 34 18 8 32 26 18 46-28-8-48 18-42 46-36-22-72-8-90-2V0Z" />
              <ellipse cx="36" cy="28" rx="48" ry="36" />
              <ellipse cx="96" cy="18" rx="42" ry="30" />
              <ellipse cx="168" cy="10" rx="58" ry="28" />
              <ellipse cx="236" cy="16" rx="50" ry="32" />
              <ellipse cx="308" cy="12" rx="46" ry="30" />
              <ellipse cx="366" cy="30" rx="52" ry="38" />
              <ellipse cx="52" cy="72" rx="34" ry="24" />
              <ellipse cx="128" cy="58" rx="30" ry="20" />
              <ellipse cx="214" cy="64" rx="36" ry="22" />
              <ellipse cx="292" cy="54" rx="32" ry="22" />
              <ellipse cx="348" cy="78" rx="38" ry="24" />
            </g>
            <g fill="#10281c">
              <path d="M0 70c28 8 42-18 70-8 18 8 14 32-8 38-22 4-18 28 8 30-36 18-58 8-70 4V70Z" />
              <path d="M390 64c-30 10-40-16-72-6-20 8-16 34 6 40 24 4 20 28-6 32 34 16 54 8 72 2V64Z" />
            </g>
            <g fill="#07140f">
              <path d="M0 120c22-46 48-28 58 8 18-38 40-18 46 14 12-30 38-22 40 10-28 8-36 38-18 62-34-4-46 28-28 54-38-14-62 18-50 58-32-22-48 8-48 8V120Z" />
              <path d="M390 110c-24-42-50-22-60 12-16-36-40-14-46 18-14-32-38-20-42 12 30 6 38 36 18 60 34-2 48 30 30 56 36-12 60 20 50 58 34-20 50 10 50 10V110Z" />
              <path d="M18 844c8-120 28-210 8-320 26 34 48-20 38-78 22 40 54-8 42-70 24 28 44-30 26-64 18 88 40 210 12 318-8 48 4 140 4 214H18Z" />
              <path d="M372 844c-8-120-28-210-8-320-26 34-48-20-38-78-22 40-54-8-42-70-24 28-44-30-26-64-18 88-40 210-12 318 8 48-4 140-4 214h130Z" transform="translate(-42)" />
            </g>
            <g fill="#163a28">
              <ellipse cx="22" cy="210" rx="28" ry="46" />
              <ellipse cx="48" cy="310" rx="24" ry="40" />
              <ellipse cx="18" cy="420" rx="30" ry="52" />
              <ellipse cx="54" cy="530" rx="22" ry="36" />
              <ellipse cx="26" cy="640" rx="32" ry="48" />
              <ellipse cx="368" cy="198" rx="28" ry="44" />
              <ellipse cx="342" cy="292" rx="22" ry="38" />
              <ellipse cx="374" cy="404" rx="30" ry="50" />
              <ellipse cx="336" cy="518" rx="24" ry="40" />
              <ellipse cx="366" cy="628" rx="32" ry="48" />
            </g>
            <g fill="#f2c96b" fill-opacity="0.22">
              <circle cx="74" cy="96" r="2.2" />
              <circle cx="312" cy="88" r="1.8" />
              <circle cx="48" cy="250" r="1.6" />
              <circle cx="344" cy="236" r="2" />
              <circle cx="28" cy="470" r="1.4" />
              <circle cx="360" cy="452" r="1.7" />
            </g>
          </svg>
        </div>
        <div id="scene" aria-hidden="true"></div>
        <div class="top-bar">
          <p id="status" role="status" aria-live="polite">準備しています…</p>
          <button id="stop-button" class="icon-button" type="button" aria-label="体験を終了">終了</button>
        </div>
        <div id="result" class="result-card" hidden>
          <p>蝶は森へ帰っていきました。</p>
          <button id="replay-button" class="primary-button" type="button">もう一度</button>
        </div>
      </section>

      <section id="error-panel" class="panel panel--error" hidden>
        <p class="eyebrow">うまく起動できませんでした</p>
        <h2 id="error-title">カメラを確認してください</h2>
        <p id="error-message"></p>
        <button id="retry-button" class="primary-button" type="button">やり直す</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
