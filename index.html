<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10251d" />
    <meta name="description" content="頭のまわりを舞う蝶と、ひと休みするAR体験" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>蝶の森へ</title>
  </head>
  <body>
    <main id="app">
      <section id="welcome" class="panel panel--welcome">
        <p class="eyebrow">30秒の森時間</p>
        <h1>蝶の森へ</h1>
        <p class="lead">正面カメラに蝶を呼んで、週末の森の景色に思いを馳せよう。</p>
        <ul class="notes">
          <li>映像は端末内で処理され、送信されません</li>
          <li>明るい場所で、顔全体を画面に入れてください</li>
        </ul>
        <button id="start-button" class="primary-button" type="button">蝶を呼ぶ</button>
      </section>

      <section id="experience" class="experience" hidden aria-label="ARカメラ">
        <video id="camera" playsinline muted></video>
        <div class="forest-frame" aria-hidden="true">
          <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#08150f" />
                <stop offset="70%" stop-color="#10281c" stop-opacity="0.75" />
                <stop offset="100%" stop-color="#10281c" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="leftGrove" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#07140f" />
                <stop offset="70%" stop-color="#123224" stop-opacity="0.7" />
                <stop offset="100%" stop-color="#123224" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="rightGrove" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0%" stop-color="#07140f" />
                <stop offset="70%" stop-color="#123224" stop-opacity="0.7" />
                <stop offset="100%" stop-color="#123224" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect width="390" height="88" fill="url(#canopy)" />
            <rect width="44" height="844" fill="url(#leftGrove)" />
            <rect x="346" width="44" height="844" fill="url(#rightGrove)" />
            <g fill="#0a1c14">
              <ellipse cx="28" cy="18" rx="36" ry="24" />
              <ellipse cx="86" cy="8" rx="32" ry="20" />
              <ellipse cx="148" cy="6" rx="40" ry="18" />
              <ellipse cx="214" cy="8" rx="36" ry="20" />
              <ellipse cx="282" cy="6" rx="34" ry="18" />
              <ellipse cx="350" cy="16" rx="38" ry="24" />
              <ellipse cx="16" cy="48" rx="22" ry="16" />
              <ellipse cx="374" cy="46" rx="24" ry="16" />
            </g>
            <g fill="#163a28">
              <ellipse cx="8" cy="180" rx="18" ry="32" />
              <ellipse cx="6" cy="310" rx="16" ry="28" />
              <ellipse cx="10" cy="450" rx="18" ry="34" />
              <ellipse cx="6" cy="590" rx="16" ry="30" />
              <ellipse cx="12" cy="730" rx="20" ry="36" />
              <ellipse cx="382" cy="170" rx="18" ry="30" />
              <ellipse cx="384" cy="300" rx="16" ry="28" />
              <ellipse cx="380" cy="440" rx="18" ry="34" />
              <ellipse cx="384" cy="580" rx="16" ry="30" />
              <ellipse cx="378" cy="720" rx="20" ry="36" />
            </g>
            <g fill="#f2c96b" fill-opacity="0.28">
              <circle cx="36" cy="52" r="1.6" />
              <circle cx="354" cy="48" r="1.4" />
              <circle cx="18" cy="240" r="1.2" />
              <circle cx="372" cy="228" r="1.3" />
            </g>
          </svg>
        </div>
        <div id="scene" aria-hidden="true"></div>
        <div class="top-bar">
          <p id="status" role="status" aria-live="polite">準備しています…</p>
          <button id="stop-button" class="icon-button" type="button" aria-label="体験を終了">終了</button>
        </div>
        <div id="result" class="result-card" hidden>
          <p>蝶は森へ帰っていきました。</p>
          <button id="replay-button" class="primary-button" type="button">もう一度</button>
        </div>
      </section>

      <section id="error-panel" class="panel panel--error" hidden>
        <p class="eyebrow">うまく起動できませんでした</p>
        <h2 id="error-title">カメラを確認してください</h2>
        <p id="error-message"></p>
        <button id="retry-button" class="primary-button" type="button">やり直す</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
